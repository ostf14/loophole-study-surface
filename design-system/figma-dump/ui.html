<style>
  body { font: 13px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 16px; color: #171712; }
  h1 { font-size: 13px; font-weight: 800; margin: 0 0 12px; }
  #status { color: #171712; min-height: 20px; }
  #detail { color: #575752; min-height: 18px; font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { color: #989286; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #track { height: 10px; border: 2px solid #171712; border-radius: 999px;
           background: #f3f1ed; margin: 12px 0; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #09b2a8; transition: width .12s linear; }
  button { font: inherit; font-weight: 700; padding: 8px 14px; margin-right: 8px;
           border: 2px solid #171712; border-radius: 999px; background: #eaf84f; cursor: pointer; }
  button:disabled { background: #f3f1ed; color: #989286; border-color: #989286; cursor: not-allowed; }
  #counts { margin-top: 12px; color: #575752; font-variant-numeric: tabular-nums; }
  .err { color: #c62d2d; white-space: pre-wrap; font-size: 12px; }
</style>

<h1>LO Design System Dump</h1>
<div id="status">Запускаюсь…</div>
<div id="detail"></div>
<div id="clock">идёт 0 с</div>
<div id="track"><div id="fill"></div></div>
<div>
  <button id="save" disabled>Скачать JSON</button>
  <button id="copy" disabled>Скопировать</button>
</div>
<div id="counts"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let json = null, done = false;

  /* Часы крутятся в окне плагина, а не в основном потоке. Если цифра идёт —
     плагин жив, даже когда обход надолго занял поток. */
  const started = Date.now();
  setInterval(() => {
    if (done) return;
    $('clock').textContent = 'идёт ' + Math.round((Date.now() - started) / 1000) + ' с';
  }, 250);

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;

    if (m.kind === 'status') { $('status').textContent = m.text; $('detail').textContent = ''; }

    if (m.kind === 'progress') {
      $('status').textContent = 'Обхожу компоненты: ' + (m.done + 1) + ' из ' + m.total;
      $('detail').textContent = m.name;
      $('fill').style.width = ((m.done + 1) / m.total * 100).toFixed(1) + '%';
    }

    if (m.kind === 'error') {
      done = true;
      $('status').textContent = 'Ошибка — скинь этот текст в чат:';
      $('detail').innerHTML = '';
      const pre = document.createElement('div');
      pre.className = 'err';
      pre.textContent = m.text;
      $('counts').appendChild(pre);
    }

    if (m.kind === 'done') {
      done = true;
      json = m.json;
      $('fill').style.width = '100%';
      $('status').textContent = 'Готово за ' + Math.round((Date.now() - started) / 1000) + ' с.';
      $('detail').textContent = 'Размер ' + (json.length / 1024 / 1024).toFixed(2) + ' МБ';
      $('clock').textContent = '';
      $('counts').textContent =
        'компонентов ' + m.counts.components +
        ' · текстовых стилей ' + m.counts.textStyles +
        ' · заливок ' + m.counts.paintStyles +
        ' · эффектов ' + m.counts.effectStyles;
      $('save').disabled = false;
      $('copy').disabled = false;
    }
  };

  $('save').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'lo-design-system.json';
    a.click();
  };

  $('copy').onclick = async () => {
    await navigator.clipboard.writeText(json);
    $('copy').textContent = 'Скопировано';
  };
</script>
